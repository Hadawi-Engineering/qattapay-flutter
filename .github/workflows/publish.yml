name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, analyze + test but do not publish to pub.dev"
        type: boolean
        required: false
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate tag matches pubspec
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PUB_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          if [[ "$TAG_VERSION" != "$PUB_VERSION" ]]; then
            echo "Tag v$TAG_VERSION does not match pubspec version $PUB_VERSION"
            exit 1
          fi

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Dry-run publish
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        if: >-
          startsWith(github.ref, 'refs/tags/v') &&
          github.event_name == 'push'
        # Requires a pub.dev publisher token stored as PUB_CREDENTIALS (JSON).
        # Until configured, this step is a no-op placeholder — publish manually
        # with `dart pub publish` after verifying the publisher.
        run: |
          echo "Configure PUB_CREDENTIALS secret, then uncomment:"
          echo "  echo \"\$PUB_CREDENTIALS\" > \"\$PUB_CACHE/credentials.json\""
          echo "  dart pub publish --force"
          exit 0
